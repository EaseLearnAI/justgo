<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-header {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        
        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-primary);
        }
        
        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 20px;
            border-bottom: 1px solid var(--divider-color);
            cursor: pointer;
            transition: background 0.2s;
            background: var(--card-background);
        }
        
        .menu-item:last-child {
            border-bottom: none;
        }
        
        .menu-item:active {
            background: var(--section-background);
        }

        .menu-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .menu-arrow {
            color: var(--text-tertiary);
            font-size: 14px;
        }
        
        /* Achievement Card Minimal */
        .achievement-card {
            flex-shrink: 0;
            width: 100px;
            background: var(--section-background);
            border-radius: var(--radius-md);
            padding: 16px 12px;
            text-align: center;
            border: 1px solid transparent;
        }
        
        .achievement-card.locked {
            opacity: 0.5;
            background: transparent;
            border: 1px dashed var(--border-color);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1>我的</h1>
            <button onclick="showSettingsSidebar()" style="width: 40px; height: 40px; background: var(--section-background); border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; color: var(--text-primary);">
                <i class="fa-solid fa-gear"></i>
            </button>
        </header>

        <div class="content">
            <!-- User Info -->
            <div class="flex-row" style="margin-bottom: 32px;">
                <div class="user-avatar">
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80" alt="Avatar">
                </div>
                <div style="flex: 1; padding-left: 20px;">
                    <h2 style="font-size: 24px; margin-bottom: 4px;">Terry</h2>
                    <p class="text-muted" style="font-size: 14px;">连续打卡 12 天 🔥</p>
                </div>
            </div>
            
            <!-- Stats -->
            <div class="card">
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;">
                    <div class="stat-item">
                        <div class="stat-value">15</div>
                        <div class="stat-label">打卡天数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">3.2k</div>
                        <div class="stat-label">消耗热量</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">28</div>
                        <div class="stat-label">运动公里</div>
                    </div>
                </div>
            </div>
            
            <!-- Goal Progress (Replaced Gradient with Minimal) -->
            <div class="card flex-row">
                <div style="width: 50px; height: 50px; background: var(--primary-green-weak); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary-color); font-size: 24px;">
                    <i class="fa-solid fa-bullseye"></i>
                </div>
                <div style="flex: 1; padding: 0 16px;">
                    <div class="flex-row" style="margin-bottom: 8px;">
                        <span style="font-weight: 600; font-size: 15px;">今日目标</span>
                        <span style="font-size: 13px; color: var(--primary-color); font-weight: 600;">65%</span>
                    </div>
                    <div style="height: 6px; background: var(--section-background); border-radius: 3px; overflow: hidden;">
                        <div style="width: 65%; height: 100%; background: var(--primary-color); border-radius: 3px;"></div>
                    </div>
                </div>
            </div>
            
            <!-- Achievements -->
            <div style="margin-bottom: 24px;">
                <div class="flex-row" style="margin-bottom: 16px; padding: 0 4px;">
                    <span style="font-size: 18px; font-weight: 700;">我的成就</span>
                    <a href="#" style="font-size: 14px; color: var(--primary-color); text-decoration: none;">全部</a>
                </div>
                <div style="display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; -webkit-overflow-scrolling: touch;">
                    <div class="achievement-card">
                        <div style="font-size: 28px; margin-bottom: 8px;">🏆</div>
                        <div style="font-size: 12px; font-weight: 600;">初出茅庐</div>
                    </div>
                    <div class="achievement-card">
                        <div style="font-size: 28px; margin-bottom: 8px;">🔥</div>
                        <div style="font-size: 12px; font-weight: 600;">连续7天</div>
                    </div>
                    <div class="achievement-card">
                        <div style="font-size: 28px; margin-bottom: 8px;">🏃</div>
                        <div style="font-size: 12px; font-weight: 600;">50公里</div>
                    </div>
                    <div class="achievement-card locked">
                        <div style="font-size: 28px; margin-bottom: 8px; filter: grayscale(1);">🌟</div>
                        <div style="font-size: 12px; color: var(--text-secondary);">未解锁</div>
                    </div>
                </div>
            </div>
            
            <!-- Menu -->
            <div style="border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border-color); margin-bottom: 24px;">
                <div class="menu-item" onclick="showGoalsModal()">
                    <div class="menu-icon" style="background: #E3F2FD; color: #007AFF;">
                        <i class="fa-solid fa-sliders"></i>
                    </div>
                    <div style="flex: 1;">
                        <div style="font-size: 16px; font-weight: 500;">目标设置</div>
                    </div>
                    <i class="fa-solid fa-chevron-right menu-arrow"></i>
                </div>
                <div class="menu-item" onclick="showBodyStatsModal()">
                    <div class="menu-icon" style="background: #E8F5E9; color: #34C759;">
                        <i class="fa-solid fa-ruler-vertical"></i>
                    </div>
                    <div style="flex: 1;">
                        <div style="font-size: 16px; font-weight: 500;">身体数据</div>
                    </div>
                    <i class="fa-solid fa-chevron-right menu-arrow"></i>
                </div>
                <a href="history.html" class="menu-item" style="text-decoration: none;">
                    <div class="menu-icon" style="background: #FFF3E0; color: #FF9500;">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                    </div>
                    <div style="flex: 1;">
                        <div style="font-size: 16px; font-weight: 500;">历史记录</div>
                    </div>
                    <i class="fa-solid fa-chevron-right menu-arrow"></i>
                </a>
            </div>
            
            <div style="border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border-color);">
                <div class="menu-item">
                    <div class="menu-icon" style="background: var(--section-background); color: var(--text-secondary);">
                        <i class="fa-solid fa-share-nodes"></i>
                    </div>
                    <div style="flex: 1;">
                        <div style="font-size: 16px; font-weight: 500;">分享给好友</div>
                    </div>
                    <i class="fa-solid fa-chevron-right menu-arrow"></i>
                </div>
            </div>

        </div>

        <!-- Tab Bar -->
        <nav class="tab-bar">
            <a href="home.html" class="tab-item">
                <i class="fa-solid fa-house"></i>
                <span>首页</span>
            </a>
            <a href="exercise_plan.html" class="go-button">
                GO
            </a>
            <a href="profile.html" class="tab-item active">
                <i class="fa-solid fa-user"></i>
                <span>我的</span>
            </a>
        </nav>
    </div>

    <!-- 目标设置弹窗 -->
    <div id="goalsModal" class="modal-overlay" onclick="closeGoalsModal(event)">
        <div class="modal-content input-modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>目标设置</h3>
                <button class="modal-close" onclick="closeGoalsModal(event)">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>每日热量目标 (kcal)</label>
                    <input type="number" id="dailyCalorieGoal" class="input-field" placeholder="1500" value="1500" style="height: 56px;">
                </div>
                <div class="input-group">
                    <label>每日运动时长目标 (分钟)</label>
                    <input type="number" id="dailyExerciseGoal" class="input-field" placeholder="45" value="45" style="height: 56px;">
                </div>
                <div class="input-group">
                    <label>每周运动天数目标</label>
                    <input type="number" id="weeklyDaysGoal" class="input-field" placeholder="5" value="5" min="1" max="7" style="height: 56px;">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeGoalsModal(event)">取消</button>
                <button class="btn btn-primary" onclick="saveGoals()">保存</button>
            </div>
        </div>
    </div>

    <!-- 身体数据弹窗 -->
    <div id="bodyStatsModal" class="modal-overlay" onclick="closeBodyStatsModal(event)">
        <div class="modal-content input-modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>身体数据</h3>
                <button class="modal-close" onclick="closeBodyStatsModal(event)">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>身高 (cm)</label>
                    <input type="number" id="userHeight" class="input-field" placeholder="175" value="175" style="height: 56px;">
                </div>
                <div class="input-group">
                    <label>体重 (kg)</label>
                    <input type="number" id="userWeight" class="input-field" placeholder="70" value="70" style="height: 56px;">
                </div>
                <div class="input-group">
                    <label>年龄</label>
                    <input type="number" id="userAge" class="input-field" placeholder="25" value="25" style="height: 56px;">
                </div>
                <div class="input-group">
                    <label>性别</label>
                    <select id="userGender" class="input-field" style="height: 56px;">
                        <option value="male">男</option>
                        <option value="female">女</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeBodyStatsModal(event)">取消</button>
                <button class="btn btn-primary" onclick="saveBodyStats()">保存</button>
            </div>
        </div>
    </div>

    <!-- 设置侧边栏 -->
    <div id="settingsSidebar" class="sidebar-overlay" onclick="closeSettingsSidebar(event)">
        <div class="sidebar-content" onclick="event.stopPropagation()">
            <div class="sidebar-header">
                <h3>设置</h3>
                <button class="modal-close" onclick="closeSettingsSidebar(event)">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="sidebar-body">
                <a href="edit_profile.html" class="sidebar-item">
                    <div class="sidebar-icon" style="background: #E3F2FD; color: #007AFF;">
                        <i class="fa-solid fa-user-pen"></i>
                    </div>
                    <span>设置个人信息</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </a>
                <div class="sidebar-item" onclick="logout()" style="color: #D64545;">
                    <div class="sidebar-icon" style="background: #FFE5E5; color: #D64545;">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </div>
                    <span>退出登录</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </div>
            </div>
        </div>
    </div>

    <style>
        /* Sidebar Styles */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .sidebar-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .sidebar-content {
            position: absolute;
            top: 0;
            right: 0;
            width: 280px;
            height: 100%;
            background: var(--card-background);
            transform: translateX(100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .sidebar-overlay.show .sidebar-content {
            transform: translateX(0);
        }
        .sidebar-header {
            padding: calc(var(--safe-area-top) + 20px) 20px 20px;
            border-bottom: 1px solid var(--divider-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-header h3 {
            font-size: 18px;
            font-weight: 600;
        }
        .sidebar-body {
            flex: 1;
            padding: 20px;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            color: var(--text-primary);
        }
        .sidebar-item:active {
            background: var(--section-background);
        }
        .sidebar-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .sidebar-item span {
            flex: 1;
            font-size: 16px;
            font-weight: 500;
        }
        .sidebar-item > i:last-child {
            font-size: 14px;
            color: var(--text-secondary);
        }
    </style>

    <script>
        // 目标设置弹窗
        function showGoalsModal() {
            document.getElementById('goalsModal').classList.add('show');
        }
        function closeGoalsModal(event) {
            if (event) event.stopPropagation();
            document.getElementById('goalsModal').classList.remove('show');
        }
        function saveGoals() {
            const calorieGoal = document.getElementById('dailyCalorieGoal').value;
            const exerciseGoal = document.getElementById('dailyExerciseGoal').value;
            const weeklyDays = document.getElementById('weeklyDaysGoal').value;
            // 保存到 localStorage
            localStorage.setItem('dailyCalorieGoal', calorieGoal);
            localStorage.setItem('dailyExerciseGoal', exerciseGoal);
            localStorage.setItem('weeklyDaysGoal', weeklyDays);
            alert('目标已保存！');
            closeGoalsModal();
        }

        // 身体数据弹窗
        function showBodyStatsModal() {
            document.getElementById('bodyStatsModal').classList.add('show');
        }
        function closeBodyStatsModal(event) {
            if (event) event.stopPropagation();
            document.getElementById('bodyStatsModal').classList.remove('show');
        }
        function saveBodyStats() {
            const height = document.getElementById('userHeight').value;
            const weight = document.getElementById('userWeight').value;
            const age = document.getElementById('userAge').value;
            const gender = document.getElementById('userGender').value;
            // 保存到 localStorage
            localStorage.setItem('userHeight', height);
            localStorage.setItem('userWeight', weight);
            localStorage.setItem('userAge', age);
            localStorage.setItem('userGender', gender);
            alert('身体数据已保存！');
            closeBodyStatsModal();
        }

        // 设置侧边栏
        function showSettingsSidebar() {
            document.getElementById('settingsSidebar').classList.add('show');
        }
        function closeSettingsSidebar(event) {
            if (event) event.stopPropagation();
            document.getElementById('settingsSidebar').classList.remove('show');
        }
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                localStorage.removeItem('userLoggedIn');
                localStorage.removeItem('userName');
                window.location.href = 'login.html';
            }
        }

        // 加载已保存的数据
        document.addEventListener('DOMContentLoaded', function() {
            // 加载目标设置
            if (localStorage.getItem('dailyCalorieGoal')) {
                document.getElementById('dailyCalorieGoal').value = localStorage.getItem('dailyCalorieGoal');
            }
            if (localStorage.getItem('dailyExerciseGoal')) {
                document.getElementById('dailyExerciseGoal').value = localStorage.getItem('dailyExerciseGoal');
            }
            if (localStorage.getItem('weeklyDaysGoal')) {
                document.getElementById('weeklyDaysGoal').value = localStorage.getItem('weeklyDaysGoal');
            }
            // 加载身体数据
            if (localStorage.getItem('userHeight')) {
                document.getElementById('userHeight').value = localStorage.getItem('userHeight');
            }
            if (localStorage.getItem('userWeight')) {
                document.getElementById('userWeight').value = localStorage.getItem('userWeight');
            }
            if (localStorage.getItem('userAge')) {
                document.getElementById('userAge').value = localStorage.getItem('userAge');
            }
            if (localStorage.getItem('userGender')) {
                document.getElementById('userGender').value = localStorage.getItem('userGender');
            }
        });
    </script>

</body>
</html>
