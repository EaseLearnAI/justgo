<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>热量输入</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .camera-view {
            position: relative;
            height: 60vh;
            background: #000;
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .camera-overlay {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .shutter-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: white;
            border: 4px solid rgba(255,255,255,0.3);
            background-clip: content-box;
            padding: 4px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .shutter-btn:active {
            transform: scale(0.9);
        }
        .mode-switch {
            display: flex;
            background: #EDEEF0;
            border-radius: 100px; /* Pill shape */
            padding: 4px;
            margin-bottom: 24px;
            position: relative;
        }
        .mode-btn {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 600;
            color: #9A9AA0;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 1;
        }
        .mode-btn.active {
            background: white;
            color: #1C1C1E;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <a href="home.html" style="color: #1C1C1E;"><i class="fa-solid fa-arrow-left"></i></a>
            <h1>记录热量</h1>
            <div style="width: 20px;"></div>
        </header>

        <div class="content">
            <div class="mode-switch">
                <div class="mode-btn active" id="btn-scan">拍照识别</div>
                <div class="mode-btn" id="btn-type">文字记录</div>
            </div>

            <!-- Scan Mode -->
            <div id="mode-scan-content">
                <div class="camera-view">
                    <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=800&q=80" alt="Pizza" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.9;">
                    <div style="position: absolute; top: 20px; right: 20px; background: rgba(46,125,107,0.9); color: white; padding: 6px 14px; border-radius: 100px; font-size: 12px; font-weight: 600; backdrop-filter: blur(10px);">
                        <i class="fa-solid fa-bolt" style="color: #DCEDEA; margin-right: 4px;"></i> AI 识别中
                    </div>
                    <div class="camera-overlay">
                        <a href="exercise_plan.html" class="shutter-btn"></a>
                    </div>
                </div>
                <p class="text-center text-muted" style="font-size: 14px;">对准食物，AI 将自动计算热量</p>
            </div>

            <!-- Text Mode -->
            <div id="mode-type-content" style="display: none;">
                <div class="card" style="border: 1px solid #EDEEF0;">
                    <textarea class="input-field" placeholder="例如：我吃了一个汉堡和一杯可乐..." rows="6" style="resize: none; background: transparent; padding: 0; font-size: 18px; line-height: 1.5;"></textarea>
                </div>
                <a href="exercise_plan.html" class="btn btn-primary">
                    <i class="fa-solid fa-check"></i> 确认提交
                </a>
            </div>

        </div>
    </div>

    <script>
        const btnScan = document.getElementById('btn-scan');
        const btnType = document.getElementById('btn-type');
        const contentScan = document.getElementById('mode-scan-content');
        const contentType = document.getElementById('mode-type-content');

        btnScan.addEventListener('click', () => {
            btnScan.classList.add('active');
            btnType.classList.remove('active');
            contentScan.style.display = 'block';
            contentType.style.display = 'none';
        });

        btnType.addEventListener('click', () => {
            btnType.classList.add('active');
            btnScan.classList.remove('active');
            contentScan.style.display = 'none';
            contentType.style.display = 'block';
        });
    </script>
</body>
</html>
