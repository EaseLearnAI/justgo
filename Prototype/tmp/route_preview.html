<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>路线预览</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .map-container {
            flex: 1;
            position: relative;
            background: #e5e5ea;
            overflow: hidden;
        }
        .map-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .route-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-background);
            border-radius: 32px 32px 0 0;
            padding: 24px;
            padding-bottom: var(--safe-area-bottom);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
        }
        .weather-badge {
            position: absolute;
            top: calc(var(--safe-area-top) + 20px);
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 8px 14px;
            border-radius: 100px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
        }
        .back-btn {
            position: absolute;
            top: calc(var(--safe-area-top) + 20px);
            left: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            text-decoration: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="map-container">
            <a href="exercise_plan.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            
            <!-- Weather Badge -->
            <div class="weather-badge">
                <i class="fa-solid fa-cloud-sun" style="color: #B8860B;"></i>
                <span>24°C 适宜运动</span>
            </div>

            <!-- Fake Map Image -->
            <img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&w=800&q=80" class="map-img" alt="Map">
            
            <!-- Route Overlay (SVG Line simulation) -->
            <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">
                <path d="M 100 200 Q 150 400 300 500 T 350 700" stroke="#2E7D6B" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="10 6" />
                <circle cx="100" cy="200" r="8" fill="#2E7D6B" stroke="white" stroke-width="3"/>
                <circle cx="350" cy="700" r="8" fill="#D64545" stroke="white" stroke-width="3"/>
            </svg>

            <!-- Bottom Sheet -->
            <div class="route-info">
                <div style="width: 40px; height: 5px; background: #E5E5EA; border-radius: 3px; margin: 0 auto 24px;"></div>
                
                <div class="flex-row" style="margin-bottom: 24px;">
                    <div>
                        <h2 style="font-size: 24px; margin-bottom: 4px; color: #1C1C1E;">绿道环线</h2>
                        <p class="text-muted"><i class="fa-solid fa-location-dot"></i> 全程 3.5 公里</p>
                    </div>
                    <div class="text-right">
                        <p style="font-size: 28px; font-weight: 700; color: #2E7D6B;">45</p>
                        <p class="text-muted" style="font-size: 12px;">分钟</p>
                    </div>
                </div>

                <div class="flex-row gap-md" style="margin-bottom: 32px;">
                    <div style="flex: 1; background: #F7F8F9; padding: 16px; border-radius: 16px; text-align: center;">
                        <i class="fa-solid fa-tree" style="color: #2E7D6B; margin-bottom: 8px; font-size: 20px;"></i>
                        <p style="font-size: 12px; font-weight: 600; color: #1C1C1E;">自然</p>
                    </div>
                    <div style="flex: 1; background: #F7F8F9; padding: 16px; border-radius: 16px; text-align: center;">
                        <i class="fa-solid fa-road" style="color: #B8860B; margin-bottom: 8px; font-size: 20px;"></i>
                        <p style="font-size: 12px; font-weight: 600; color: #1C1C1E;">平稳</p>
                    </div>
                    <div style="flex: 1; background: #F7F8F9; padding: 16px; border-radius: 16px; text-align: center;">
                        <i class="fa-solid fa-camera" style="color: #5A7A9A; margin-bottom: 8px; font-size: 20px;"></i>
                        <p style="font-size: 12px; font-weight: 600; color: #1C1C1E;">风景</p>
                    </div>
                </div>

                <a href="navigation.html" class="btn btn-primary" style="height: 56px; font-size: 18px;">
                    <i class="fa-solid fa-location-arrow"></i> 开始导航
                </a>
            </div>
        </div>
    </div>

</body>
</html>
