<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>注册</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container" style="justify-content: center; padding: 40px 24px;">
        <!-- Logo -->
        <div style="text-align: center; margin-bottom: 48px;">
            <div style="width: 80px; height: 80px; background: linear-gradient(135deg, var(--primary-color) 0%, #3D9A87 100%); border-radius: 24px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; box-shadow: 0 8px 24px rgba(46, 125, 107, 0.3);">
                <i class="fa-solid fa-fire-flame-curved" style="font-size: 36px; color: white;"></i>
            </div>
            <h1 style="font-size: 28px; margin-bottom: 8px;">Just Go!</h1>
            <p class="text-muted">开启健康运动之旅</p>
        </div>

        <!-- Form -->
        <div style="width: 100%;">
            <div id="errorMsg" style="background: #FFE5E5; color: #D64545; padding: 12px 16px; border-radius: var(--radius-md); font-size: 14px; margin-bottom: 20px; display: none;"></div>

            <div class="input-group">
                <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px;">手机号</label>
                <input type="tel" id="phone" class="input-field" placeholder="11位手机号" style="height: 56px;" maxlength="11">
            </div>

            <div class="input-group">
                <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px;">密码</label>
                <input type="password" id="password" class="input-field" placeholder="6-20个字符" style="height: 56px;" maxlength="20">
            </div>

            <div class="input-group">
                <label style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px;">确认密码</label>
                <input type="password" id="confirmPassword" class="input-field" placeholder="再次输入密码" style="height: 56px;" maxlength="20">
            </div>

            <button class="btn btn-primary" onclick="register()" style="margin-top: 24px; height: 56px; font-size: 17px;">
                注册
            </button>

            <p style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-secondary);">
                已有账号？<a href="login.html" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">立即登录</a>
            </p>
        </div>
    </div>

    <script>
        function register() {
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('errorMsg');

            // 验证
            if (!phone || !password || !confirmPassword) {
                errorMsg.textContent = '请填写完整信息';
                errorMsg.style.display = 'block';
                return;
            }

            if (!/^1\d{10}$/.test(phone)) {
                errorMsg.textContent = '请输入正确的手机号';
                errorMsg.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                errorMsg.textContent = '密码至少6个字符';
                errorMsg.style.display = 'block';
                return;
            }

            if (password !== confirmPassword) {
                errorMsg.textContent = '两次密码不一致';
                errorMsg.style.display = 'block';
                return;
            }

            const users = JSON.parse(localStorage.getItem('users') || '[]');

            if (users.find(u => u.phone === phone)) {
                errorMsg.textContent = '该手机号已注册';
                errorMsg.style.display = 'block';
                return;
            }

            users.push({ phone, password, createdAt: new Date().toISOString() });
            localStorage.setItem('users', JSON.stringify(users));

            localStorage.setItem('userLoggedIn', 'true');
            localStorage.setItem('userName', phone);
            localStorage.setItem('userPhone', phone);
            window.location.href = 'home.html';
        }
    </script>

</body>
</html>
