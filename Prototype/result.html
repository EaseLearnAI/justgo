<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>完成运动</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container" style="justify-content: center; align-items: center; padding: 40px;">
        
        <div style="width: 120px; height: 120px; background: #DCEDEA; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 40px;">
            <i class="fa-solid fa-trophy" style="color: #2E7D6B; font-size: 50px;"></i>
        </div>

        <h1 style="font-size: 32px; margin-bottom: 12px; text-align: center; color: #1C1C1E;">做得漂亮！</h1>
        <p class="text-muted" style="margin-bottom: 48px; text-align: center;">你已经成功消耗了摄入热量</p>

        <div class="card w-100" style="margin-bottom: 40px; border: 1px solid #EDEEF0;">
            <div class="flex-row" style="padding: 16px 0; border-bottom: 1px solid #EDEEF0;">
                <span class="text-muted">消耗热量</span>
                <span style="font-weight: 700; font-size: 18px; color: #1C1C1E;">285 <small style="font-weight: 400; font-size: 14px; color: #9A9AA0;">kcal</small></span>
            </div>
            <div class="flex-row" style="padding: 16px 0; border-bottom: 1px solid #EDEEF0;">
                <span class="text-muted">运动时长</span>
                <span style="font-weight: 700; font-size: 18px; color: #1C1C1E;">42:15</span>
            </div>
            <div class="flex-row" style="padding: 16px 0;">
                <span class="text-muted">连续打卡</span>
                <span style="color: #2E7D6B; font-weight: 700; display: flex; align-items: center; gap: 6px;">
                    <i class="fa-solid fa-fire"></i> +1
                </span>
            </div>
        </div>

        <a href="home.html" class="btn btn-primary" style="margin-bottom: 16px;">
            完成
        </a>
        
        <a href="#" style="color: #9A9AA0; text-decoration: none; font-size: 14px; font-weight: 500;">分享成就</a>

    </div>

</body>
</html>
