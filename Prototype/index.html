<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Go! - App Prototype</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: #1c1c1e; overflow: auto;">

    <div class="simulator-container">
        <!-- Login Screen -->
        <div class="device-frame">
            <div class="dynamic-island"></div>
            <div class="device-screen">
                <iframe src="login.html" title="Login"></iframe>
            </div>
            <p style="color: #fff; text-align: center; margin-top: 10px;">0. 登录 (Login)</p>
        </div>

        <!-- Home Screen -->
        <div class="device-frame">
            <div class="dynamic-island"></div>
            <div class="device-screen">
                <iframe src="home.html" title="Home"></iframe>
            </div>
            <p style="color: #fff; text-align: center; margin-top: 10px;">1. 首页 (Home)</p>
        </div>


        <!-- Exercise Plan -->
        <div class="device-frame">
            <div class="dynamic-island"></div>
            <div class="device-screen">
                <iframe src="exercise_plan.html" title="Plan"></iframe>
            </div>
            <p style="color: #fff; text-align: center; margin-top: 10px;">3. 运动方案 (Plan)</p>
        </div>





        <!-- Result -->
        <div class="device-frame">
            <div class="dynamic-island"></div>
            <div class="device-screen">
                <iframe src="result.html" title="Result"></iframe>
            </div>
            <p style="color: #fff; text-align: center; margin-top: 10px;">6. 完成 (Result)</p>
        </div>

        <!-- Profile -->
        <div class="device-frame">
            <div class="dynamic-island"></div>
            <div class="device-screen">
                <iframe src="profile.html" title="Profile"></iframe>
            </div>
            <p style="color: #fff; text-align: center; margin-top: 10px;">7. 我的 (Profile)</p>
        </div>

        <!-- History -->
        <div class="device-frame">
            <div class="dynamic-island"></div>
            <div class="device-screen">
                <iframe src="history.html" title="History"></iframe>
            </div>
            <p style="color: #fff; text-align: center; margin-top: 10px;">8. 历史记录 (History)</p>
        </div>
    </div>

</body>
</html>
